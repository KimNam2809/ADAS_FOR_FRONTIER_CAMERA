name: Kaggle · Traffic Sign Full

on:
  workflow_dispatch:
    inputs:
      account:
        description: Kaggle account used to submit the job
        required: true
        type: choice
        options: [account_1, account_2]
        default: account_1
      confirmation:
        description: Type RUN_FULL after pilot Quality Gate is approved
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: kaggle-sign-full-${{ inputs.account }}
  cancel-in-progress: false

jobs:
  submit:
    if: inputs.confirmation == 'RUN_FULL'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      ACCOUNT_1_USERNAME: ${{ secrets.KAGGLE_USERNAME_ACCOUNT_1 }}
      ACCOUNT_1_TOKEN: ${{ secrets.KAGGLE_API_TOKEN_ACCOUNT_1 }}
      ACCOUNT_2_USERNAME: ${{ secrets.KAGGLE_USERNAME_ACCOUNT_2 }}
      ACCOUNT_2_TOKEN: ${{ secrets.KAGGLE_API_TOKEN_ACCOUNT_2 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select Kaggle account
        shell: bash
        run: |
          if [[ "${{ inputs.account }}" == "account_2" ]]; then
            echo "KAGGLE_USERNAME=$ACCOUNT_2_USERNAME" >> "$GITHUB_ENV"
            echo "KAGGLE_API_TOKEN=$ACCOUNT_2_TOKEN" >> "$GITHUB_ENV"
          else
            echo "KAGGLE_USERNAME=$ACCOUNT_1_USERNAME" >> "$GITHUB_ENV"
            echo "KAGGLE_API_TOKEN=$ACCOUNT_1_TOKEN" >> "$GITHUB_ENV"
          fi
      - run: python -m pip install "kaggle>=1.7,<2"
      - name: Fail-closed preflight
        run: python train-model-auto-in-kaggle/scripts/preflight.py --config train-model-auto-in-kaggle/configs/sign_full.yaml
      - name: Build full package
        run: python train-model-auto-in-kaggle/scripts/prepare_kernel.py --config train-model-auto-in-kaggle/configs/sign_full.yaml --owner "$KAGGLE_USERNAME"
      - name: Submit full GPU job
        id: submit
        run: python train-model-auto-in-kaggle/scripts/submit_kernel.py --package build/kernel
      - name: Create human-gated status issue
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_REF: ${{ steps.submit.outputs.kernel_ref }}
          KERNEL_URL: ${{ steps.submit.outputs.kernel_url }}
        shell: bash
        run: |
          gh label create kaggle-run --color 0969DA --force
          gh label create promotion-blocked --color D73A4A --force
          gh issue create --title "[Kaggle][Full] $KERNEL_REF" --label kaggle-run,promotion-blocked --body "Kernel: [$KERNEL_REF]($KERNEL_URL)
          Commit: $GITHUB_SHA
          Status: SUBMITTED

          Candidate remains blocked until evidence evaluation and explicit Human Quality Gate."
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-sign-full-control-evidence
          path: build/
          retention-days: 14

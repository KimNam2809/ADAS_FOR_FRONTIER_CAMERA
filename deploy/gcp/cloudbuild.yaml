steps:
  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.cloud
      - -t
      - asia-southeast1-docker.pkg.dev/$PROJECT_ID/roadwatch/roadwatch-web:$BUILD_ID
      - .
  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-southeast1-docker.pkg.dev/$PROJECT_ID/roadwatch/roadwatch-web:$BUILD_ID
  - id: build-tts-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.tts
      - -t
      - asia-southeast1-docker.pkg.dev/$PROJECT_ID/roadwatch/roadwatch-tts:$BUILD_ID
      - .
  - id: push-tts-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-southeast1-docker.pkg.dev/$PROJECT_ID/roadwatch/roadwatch-tts:$BUILD_ID
  - id: deploy-tts
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - roadwatch-tts
      - --project=$PROJECT_ID
      - --region=asia-southeast1
      - --platform=managed
      - --image=asia-southeast1-docker.pkg.dev/$PROJECT_ID/roadwatch/roadwatch-tts:$BUILD_ID
      - --no-allow-unauthenticated
      - --port=8080
      - --cpu=2
      - --memory=2Gi
      - --timeout=120
      - --concurrency=4
      - --cpu-boost
      - --no-cpu-throttling
      - --min=0
      - --max=1
      - --set-env-vars=ROADWATCH_GCS_ASSET_BUCKET=c3-roadwatch-162-roadwatch-assets,ROADWATCH_ASSET_GROUPS=voices,ROADWATCH_TTS_VOICE=voices/vi_VN-vais1000-medium.onnx,ROADWATCH_TTS_PRECACHE=0
  - id: authorize-web-to-tts
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - |
        PROJECT_NUMBER="$$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')"
        RUNTIME_SA="$${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
        gcloud run services add-iam-policy-binding roadwatch-tts \
          --project="$PROJECT_ID" \
          --region=asia-southeast1 \
          --member="serviceAccount:$${RUNTIME_SA}" \
          --role=roles/run.invoker
  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - |
        TTS_URL="$$(gcloud run services describe roadwatch-tts --project="$PROJECT_ID" --region=asia-southeast1 --format='value(status.url)')"
        gcloud run deploy roadwatch-web \
          --project="$PROJECT_ID" \
          --region=asia-southeast1 \
          --platform=managed \
          --image="asia-southeast1-docker.pkg.dev/$PROJECT_ID/roadwatch/roadwatch-web:$BUILD_ID" \
          --allow-unauthenticated \
          --port=8000 \
          --cpu=8 \
          --memory=8Gi \
          --timeout=3600 \
          --concurrency=80 \
          --session-affinity \
          --cpu-boost \
          --no-cpu-throttling \
          --min=0 \
          --max=1 \
          --set-env-vars="^@^ROADWATCH_CLOUD_MODE=web_demo@ROADWATCH_DEFERRED_STARTUP=1@ROADWATCH_CLOUD_FAST=0@ROADWATCH_CLOUD_FULL=1@ROADWATCH_CLOUD_IMAGE_SIZE=320@ROADWATCH_ORT_INTRA_OP_NUM_THREADS=4@ROADWATCH_ORT_INTER_OP_NUM_THREADS=1@ROADWATCH_ORT_OPTIONAL_INTRA_OP_NUM_THREADS=2@ROADWATCH_ORT_OPTIONAL_INTER_OP_NUM_THREADS=1@ROADWATCH_DISABLE_AUDIO=1@ROADWATCH_MAX_UPLOAD_MB=25@ROADWATCH_GCS_ASSET_BUCKET=c3-roadwatch-162-roadwatch-assets@ROADWATCH_ASSET_GROUPS=models@ROADWATCH_ASSET_PATHS=yolo11n_320.onnx,roadwatch_detector_v2_416.onnx,roadwatch_speed_digits_v2.onnx,yolop_lane_detection_640.onnx@ROADWATCH_TTS_SERVICE_URL=$${TTS_URL}@ROADWATCH_TTS_WARMUP_TIMEOUT_SECONDS=180"
images:
  - asia-southeast1-docker.pkg.dev/$PROJECT_ID/roadwatch/roadwatch-web:$BUILD_ID
  - asia-southeast1-docker.pkg.dev/$PROJECT_ID/roadwatch/roadwatch-tts:$BUILD_ID
options:
  logging: CLOUD_LOGGING_ONLY

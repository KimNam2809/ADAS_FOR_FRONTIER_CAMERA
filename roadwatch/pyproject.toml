[project]
name = "roadwatch-copilot"
version = "0.2.1"
description = "Offline, evidence-aware forward camera ADAS warning assistant"
requires-python = ">=3.10,<3.13"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

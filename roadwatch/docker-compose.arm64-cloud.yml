services:
  roadwatch:
    build:
      context: .
      dockerfile: Dockerfile.arm64-cloud
    platform: linux/arm64
    gpus: all
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./media:/app/media:ro
      - ./data:/app/data
      - ./reports:/app/reports
    environment:
      ROADWATCH_RUNTIME: cuda
      ROADWATCH_DISABLE_AUDIO: "1"
    restart: unless-stopped

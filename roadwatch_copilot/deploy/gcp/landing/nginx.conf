server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json text/plain;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    location = /healthz { access_log off; return 200 'ok'; }
    location ^~ /api/ { return 404; }
    location ~ ^/(Dockerfile|nginx\.conf)$ { return 404; }
    location /assets/ { expires 1y; try_files $uri =404; }
    location /media/ { expires 1h; try_files $uri =404; }
    location /documents/ { expires 1h; try_files $uri =404; }
    location / { expires -1; try_files $uri $uri/ =404; }
}
